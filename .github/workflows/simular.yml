name: Simular contra o meta

# Modo infinito: cada rodada joga ~5h40 em 6 partes paralelas, salva os resultados
# e dispara a próxima. Só se reinicia sozinha com o repositório PÚBLICO (minutos ilimitados).
# Para parar: crie um arquivo PARAR na raiz do repositório (ou desative o fluxo na aba Actions).
on:
  schedule:
    - cron: '17 */6 * * *'      # religa a cada 6 h se a corrente tiver caído
  workflow_dispatch:
    inputs:
      partidas:
        description: 'Meta de partidas por lista ("auto" = sem fim)'
        default: 'auto'
      minutos:
        description: 'Minutos de jogo em cada parte'
        default: '340'

concurrency:
  group: simular
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  jogar:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Jogar partidas
        run: |
          V=$(cat VERSAO)
          mkdir -p resultados/$V
          export RES=resultados/$V
          export SHARD=${{ matrix.parte }}/6
          export SAIDA=resultados/$V/novo-${{ matrix.parte }}.jsonl
          touch $SAIDA
          if [ -f PARAR ]; then echo "Arquivo PARAR encontrado"; exit 0; fi
          MIN=${{ github.event.inputs.minutos || 340 }}
          if [ "${{ github.event.repository.private }}" = "true" ] && [ $MIN -gt 25 ]; then MIN=25; fi
          FIM=$(( $(date +%s) + MIN * 60 ))
          # no modo auto, cada chamada sobe a meta em 20 partidas por lista; repete até acabar o tempo
          while [ $(date +%s) -lt $(( FIM - 30 )) ]; do
            export PRAZO=$(( FIM - $(date +%s) ))
            node sim_meta.js rodar ${{ github.event.inputs.partidas || 'auto' }} $(nproc)
            [ "${{ github.event.inputs.partidas || 'auto' }}" = "auto" ] || break
          done
          cp $SAIDA novo-${{ matrix.parte }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parte-${{ matrix.parte }}
          path: novo-${{ matrix.parte }}.jsonl
          if-no-files-found: ignore

  juntar:
    needs: jogar
    if: ${{ always() && needs.jogar.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          path: partes
      - name: Juntar, gerar o resumo e salvar
        run: |
          git config user.name "prizespy-bot"
          git config user.email "actions@users.noreply.github.com"
          V=$(cat VERSAO)
          DIA=$(date -u +%Y-%m-%dT%H%M)
          cat partes/*/*.jsonl > /tmp/novas.jsonl 2>/dev/null || true
          echo "$(wc -l < /tmp/novas.jsonl) partidas novas"
          # tenta até 5 vezes: pega o main mais novo, junta e envia (outra rodada pode ter salvo antes)
          for t in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p resultados/$V
            [ -s /tmp/novas.jsonl ] && cp /tmp/novas.jsonl resultados/$V/actions-$DIA.jsonl
            {
              echo "# Resumo da simulação ($V)"
              echo
              echo "Atualizado em $DIA UTC. Bot do Hide n' Sneak (lista do Rahul) contra o top 10 do meta."
              echo
              echo '```'
              RES=resultados/$V node sim_meta.js resumo
              echo '```'
            } > RESUMO.md
            git add resultados RESUMO.md resumo.json
            git commit -q -m "Simulação $DIA: novas partidas" || break
            git push -q origin HEAD:main && break
            sleep 10
          done
      - name: Disparar a próxima rodada
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f PARAR ]; then echo "PARAR: não dispara a próxima"; exit 0; fi
          gh workflow run simular.yml --ref main -f partidas=auto -f minutos=340
